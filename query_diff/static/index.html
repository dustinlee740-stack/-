<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>쿼리 비교 모듈</title>
<style>
  :root {
    --bg: #1e1e2e;
    --surface: #282840;
    --surface2: #313150;
    --border: #41415a;
    --text: #e0e0f0;
    --text-dim: #9090b0;
    --accent: #7c6ff7;
    --accent-hover: #9589ff;
    --green: #50c878;
    --red: #f05060;
    --yellow: #f0c050;
    --radius: 8px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  /* 헤더 */
  .header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--border); }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .actions { display: flex; gap: 8px; }

  /* 제목 입력 */
  .title-row { padding: 16px 24px 8px; }
  .title-row input { width: 100%; padding: 10px 14px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 15px; }
  .title-row input:focus { outline: none; border-color: var(--accent); }

  /* 쿼리 패널 컨테이너 */
  .panels { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 8px 24px 16px; }
  @media (max-width: 900px) { .panels { grid-template-columns: 1fr; } }

  /* 쿼리 패널 */
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); }
  .panel-head .label { font-weight: 600; font-size: 14px; }

  /* 탭 */
  .tabs { display: flex; gap: 0; }
  .tabs button { padding: 6px 14px; border: 1px solid var(--border); background: transparent; color: var(--text-dim); font-size: 12px; cursor: pointer; transition: all .15s; }
  .tabs button:first-child { border-radius: var(--radius) 0 0 var(--radius); }
  .tabs button:last-child { border-radius: 0 var(--radius) var(--radius) 0; }
  .tabs button.active { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* 방언 셀렉트 */
  .dialect-row { display: flex; align-items: center; gap: 8px; padding: 10px 16px; font-size: 13px; }
  .dialect-row select { padding: 4px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 13px; }

  /* SQL 에디터 */
  .editor-wrap { padding: 0 16px 12px; }
  .editor-wrap textarea { width: 100%; min-height: 200px; padding: 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 13px; line-height: 1.6; resize: vertical; tab-size: 2; }
  .editor-wrap textarea:focus { outline: none; border-color: var(--accent); }

  /* 파일 업로드 */
  .file-area { padding: 12px 16px; }
  .drop-zone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 32px; text-align: center; color: var(--text-dim); font-size: 13px; cursor: pointer; transition: border-color .15s; }
  .drop-zone:hover, .drop-zone.dragover { border-color: var(--accent); }
  .drop-zone input { display: none; }
  .file-info { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 12px; background: var(--surface2); border-radius: var(--radius); font-size: 13px; }
  .file-info .remove { cursor: pointer; color: var(--red); margin-left: auto; }

  /* Wiki 입력 */
  .wiki-area { padding: 12px 16px; }
  .wiki-area .url-row { display: flex; gap: 8px; }
  .wiki-area input { flex: 1; padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); font-size: 13px; }
  .wiki-area .blocks { margin-top: 10px; }
  .wiki-area .block-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--surface2); border-radius: var(--radius); margin-bottom: 4px; font-size: 13px; cursor: pointer; }
  .wiki-area .block-item:hover { background: var(--border); }
  .wiki-area .block-item.selected { border: 1px solid var(--accent); }

  /* 검증 상태 */
  .validation-status { padding: 8px 16px 12px; font-size: 12px; }
  .status-ok { color: var(--green); }
  .status-err { color: var(--red); }
  .status-suggestion { color: var(--yellow); margin-top: 4px; }
  .structure-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .structure-tags span { padding: 2px 8px; background: var(--surface2); border-radius: 10px; font-size: 11px; color: var(--text-dim); }

  /* 차이 요약 섹션 */
  .summary-section { padding: 0 24px 16px; }
  .summary-section .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .summary-section h2 { font-size: 15px; font-weight: 600; }
  .metrics-table { width: 100%; border-collapse: collapse; background: var(--surface); border-radius: var(--radius); overflow: hidden; }
  .metrics-table th, .metrics-table td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border); font-size: 13px; }
  .metrics-table th { background: var(--surface2); color: var(--text-dim); font-weight: 500; font-size: 12px; }
  .metrics-table input { width: 100%; padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 13px; text-align: right; }
  .metrics-table input[type="text"] { text-align: left; }
  .metrics-table .computed { color: var(--accent); font-weight: 600; text-align: right; }
  .metrics-table .negative { color: var(--red); }
  .metrics-table .positive { color: var(--green); }
  .metrics-table .remove-row { cursor: pointer; color: var(--text-dim); font-size: 16px; }
  .metrics-table .remove-row:hover { color: var(--red); }

  /* 하단 버튼 */
  .bottom-bar { display: flex; justify-content: center; gap: 12px; padding: 16px 24px 32px; }

  /* 버튼 공통 */
  .btn { padding: 8px 20px; border: 1px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text); font-size: 13px; cursor: pointer; transition: all .15s; }
  .btn:hover { background: var(--surface2); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-primary:disabled { opacity: .4; cursor: not-allowed; }
  .btn-sm { padding: 5px 12px; font-size: 12px; }
  .btn-danger { color: var(--red); border-color: var(--red); }

  /* 검증 모달 */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
  .modal-overlay.hidden { display: none; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: 520px; max-width: 90vw; max-height: 88vh; padding: 20px 24px; display: flex; flex-direction: column; }
  .modal h3 { font-size: 16px; margin-bottom: 12px; flex-shrink: 0; }
  .modal > div:not(.modal-actions) { overflow-y: auto; flex: 1 1 auto; min-height: 0; padding-right: 4px; }
  .modal .result-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
  .modal .result-item:last-child { border-bottom: none; }
  .modal .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; flex-shrink: 0; }
</style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <h1>← 쿼리 비교 요청</h1>
  <div class="actions">
    <button class="btn btn-sm" id="btnSave">임시저장</button>
  </div>
</div>

<!-- 제목 -->
<div class="title-row">
  <input type="text" id="inputTitle" placeholder="비교 제목을 입력하세요 (예: 매출집계 운영-분석 차이 확인)">
</div>

<!-- 쿼리 패널 -->
<div class="panels">
  <!-- A쿼리 -->
  <div class="panel" id="panelA">
    <div class="panel-head">
      <span class="label">A쿼리 (운영계)</span>
      <div class="tabs">
        <button class="active" data-tab="text">텍스트</button>
        <button data-tab="file">파일</button>
        <button data-tab="wiki">Wiki</button>
      </div>
    </div>
    <div class="dialect-row">
      <label>방언:</label>
      <select class="dialect-select">
        <option value="oracle" selected>Oracle</option>
        <option value="hive">HiveQL</option>
        <option value="mysql">MySQL</option>
        <option value="postgres">PostgreSQL</option>
      </select>
    </div>
    <!-- 텍스트 탭 -->
    <div class="tab-content text-tab">
      <div class="editor-wrap">
        <textarea class="sql-editor" placeholder="SELECT emp_no, dept_cd, sal_amt&#10;FROM hr.employee e&#10;JOIN hr.department d&#10;  ON e.dept_cd = d.dept_cd&#10;WHERE e.status = 'A'&#10;GROUP BY emp_no, dept_cd"></textarea>
      </div>
    </div>
    <!-- 파일 탭 -->
    <div class="tab-content file-tab" style="display:none;">
      <div class="file-area">
        <div class="drop-zone">
          <input type="file" accept=".sql,.txt">
          📄 파일을 선택하거나 드래그 &amp; 드롭<br><small>.sql / .txt (10MB 이하)</small>
        </div>
        <div class="file-info" style="display:none;">
          <span class="file-name"></span>
          <span class="file-size"></span>
          <span class="remove">✕</span>
        </div>
      </div>
    </div>
    <!-- Wiki 탭 -->
    <div class="tab-content wiki-tab" style="display:none;">
      <div class="wiki-area">
        <div class="url-row">
          <input type="text" class="wiki-url" placeholder="https://wiki.example.com/pages/12345">
          <button class="btn btn-sm wiki-extract">SQL 추출</button>
        </div>
        <div class="blocks"></div>
      </div>
    </div>
    <div class="validation-status"></div>
  </div>

  <!-- B쿼리 -->
  <div class="panel" id="panelB">
    <div class="panel-head">
      <span class="label">B쿼리 (분석계)</span>
      <div class="tabs">
        <button class="active" data-tab="text">텍스트</button>
        <button data-tab="file">파일</button>
        <button data-tab="wiki">Wiki</button>
      </div>
    </div>
    <div class="dialect-row">
      <label>방언:</label>
      <select class="dialect-select">
        <option value="oracle">Oracle</option>
        <option value="hive" selected>HiveQL</option>
        <option value="mysql">MySQL</option>
        <option value="postgres">PostgreSQL</option>
      </select>
    </div>
    <div class="tab-content text-tab">
      <div class="editor-wrap">
        <textarea class="sql-editor" placeholder="SELECT employee_id, department_code, salary_amount&#10;FROM dwh.dim_employee e&#10;JOIN dwh.dim_department d&#10;  ON e.department_code = d.department_code&#10;WHERE e.is_active = 'Y'&#10;GROUP BY employee_id, department_code"></textarea>
      </div>
    </div>
    <div class="tab-content file-tab" style="display:none;">
      <div class="file-area">
        <div class="drop-zone">
          <input type="file" accept=".sql,.txt">
          📄 파일을 선택하거나 드래그 &amp; 드롭<br><small>.sql / .txt (10MB 이하)</small>
        </div>
        <div class="file-info" style="display:none;">
          <span class="file-name"></span>
          <span class="file-size"></span>
          <span class="remove">✕</span>
        </div>
      </div>
    </div>
    <div class="tab-content wiki-tab" style="display:none;">
      <div class="wiki-area">
        <div class="url-row">
          <input type="text" class="wiki-url" placeholder="https://wiki.example.com/pages/67890">
          <button class="btn btn-sm wiki-extract">SQL 추출</button>
        </div>
        <div class="blocks"></div>
      </div>
    </div>
    <div class="validation-status"></div>
  </div>
</div>

<!-- 차이 요약 -->
<div class="summary-section">
  <div class="section-head">
    <h2>차이 요약 (Summary)</h2>
    <button class="btn btn-sm" id="btnAddMetric">+ 지표 추가</button>
  </div>
  <table class="metrics-table">
    <thead>
      <tr>
        <th style="width:22%">지표명</th>
        <th style="width:20%">A (운영계)</th>
        <th style="width:20%">B (분석계)</th>
        <th style="width:15%">차이</th>
        <th style="width:15%">차이율</th>
        <th style="width:8%"></th>
      </tr>
    </thead>
    <tbody id="metricsBody">
      <tr>
        <td><input type="text" class="metric-name" placeholder="매출합계"></td>
        <td><input type="number" class="metric-a" placeholder="0" step="any"></td>
        <td><input type="number" class="metric-b" placeholder="0" step="any"></td>
        <td class="computed diff-value">-</td>
        <td class="computed diff-pct">-</td>
        <td class="remove-row" title="삭제">✕</td>
      </tr>
    </tbody>
  </table>
</div>

<!-- 하단 버튼 -->
<div class="bottom-bar">
  <button class="btn" id="btnValidate">검증</button>
  <button class="btn btn-primary" id="btnExecute" disabled>비교 실행 →</button>
</div>

<!-- 검증 결과 모달 -->
<div class="modal-overlay hidden" id="validateModal">
  <div class="modal">
    <h3>검증 결과</h3>
    <div id="validateResults"></div>
    <div class="modal-actions">
      <button class="btn btn-sm" id="btnCloseModal">닫기</button>
      <button class="btn btn-sm" id="btnIgnoreError" style="display:none;">오류 무시하고 진행</button>
    </div>
  </div>
</div>

<!-- 구조 비교 결과 모달 -->
<div class="modal-overlay hidden" id="resultModal">
  <div class="modal" style="max-width:900px;">
    <h3>구조 비교 결과 (Phase 1)</h3>
    <div id="resultContent"></div>
    <div class="modal-actions">
      <button class="btn btn-sm" id="btnCloseResultModal">닫기</button>
    </div>
  </div>
</div>

<div id="toastContainer" style="position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:420px;"></div>

<script>
const API = '';
let comparisonId = null;

// --- 토스트 알림 (alert 대체) ---
// 긴 에러 메시지는 기본 120자까지만 노출하고 "자세히" 클릭 시 전체를 보여준다.
function showToast(message, opts = {}) {
  const kind = opts.kind || 'error';      // 'error' | 'info' | 'success'
  const timeout = opts.timeout ?? (kind === 'error' ? 8000 : 3500);
  const PREVIEW = 120;

  const container = document.getElementById('toastContainer');
  const msg = String(message ?? '').trim() || '알 수 없는 오류';
  const truncated = msg.length > PREVIEW;
  const preview = truncated ? msg.slice(0, PREVIEW) + '…' : msg;

  const palette = {
    error:   { bg: '#3a1f22', border: '#f05060', fg: '#ffb0b0' },
    info:    { bg: '#1f2a3a', border: '#6080c0', fg: '#b0c8e8' },
    success: { bg: '#1f3a28', border: '#40c070', fg: '#a8e0b8' },
  }[kind];

  const el = document.createElement('div');
  el.style.cssText = `
    padding:10px 12px;background:${palette.bg};border-left:3px solid ${palette.border};
    border-radius:6px;font-size:12px;color:${palette.fg};line-height:1.5;
    box-shadow:0 4px 16px rgba(0,0,0,0.35);
  `;

  const safePreview = preview.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const safeFull = msg.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">
      <div style="flex:1;min-width:0;" data-toast-body>
        <span data-toast-text>${safePreview}</span>
        ${truncated ? `<button type="button" data-toast-expand
          style="margin-left:6px;padding:0;background:none;border:none;color:${palette.border};cursor:pointer;font-size:11px;text-decoration:underline;">
          자세히</button>` : ''}
      </div>
      <button type="button" data-toast-close aria-label="닫기"
        style="background:none;border:none;color:${palette.fg};font-size:16px;line-height:1;cursor:pointer;padding:0 2px;">×</button>
    </div>
  `;

  const close = () => { el.remove(); };
  el.querySelector('[data-toast-close]').addEventListener('click', close);

  const expandBtn = el.querySelector('[data-toast-expand]');
  if (expandBtn) {
    expandBtn.addEventListener('click', () => {
      const body = el.querySelector('[data-toast-body]');
      body.innerHTML = `<div style="max-height:240px;overflow:auto;white-space:pre-wrap;font-family:monospace;font-size:11px;">${safeFull}</div>`;
    });
  }

  container.appendChild(el);
  if (timeout > 0) setTimeout(close, timeout);
}

// --- 유틸 ---
function formatNumber(n) {
  if (n === null || n === undefined || isNaN(n)) return '-';
  return Number(n).toLocaleString('ko-KR', { maximumFractionDigits: 2 });
}

// --- 탭 전환 ---
document.querySelectorAll('.panel').forEach(panel => {
  panel.querySelectorAll('.tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      panel.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const tab = btn.dataset.tab;
      panel.querySelectorAll('.tab-content').forEach(tc => tc.style.display = 'none');
      panel.querySelector(`.${tab}-tab`).style.display = '';
    });
  });
});

// --- 파일 업로드 ---
document.querySelectorAll('.panel').forEach(panel => {
  const dropZone = panel.querySelector('.drop-zone');
  const fileInput = dropZone?.querySelector('input[type=file]');
  const fileInfo = panel.querySelector('.file-info');

  if (!dropZone) return;

  dropZone.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) handleFile(panel, e.dataTransfer.files[0]);
  });
  fileInput.addEventListener('change', () => {
    if (fileInput.files.length) handleFile(panel, fileInput.files[0]);
  });

  panel.querySelector('.file-info .remove')?.addEventListener('click', () => {
    fileInfo.style.display = 'none';
    panel.querySelector('.sql-editor').value = '';
  });
});

function handleFile(panel, file) {
  if (file.size > 10 * 1024 * 1024) {
    showToast('파일 크기는 10MB 이하만 가능합니다.');
    return;
  }
  const fileInfo = panel.querySelector('.file-info');
  fileInfo.querySelector('.file-name').textContent = '📄 ' + file.name;
  fileInfo.querySelector('.file-size').textContent = `(${(file.size / 1024).toFixed(1)}KB)`;
  fileInfo.style.display = 'flex';

  const reader = new FileReader();
  reader.onload = e => {
    panel.querySelector('.sql-editor').value = e.target.result;
  };
  reader.readAsText(file);
}

// --- 지표 관리 ---
const metricsBody = document.getElementById('metricsBody');

document.getElementById('btnAddMetric').addEventListener('click', () => {
  const row = document.createElement('tr');
  row.innerHTML = `
    <td><input type="text" class="metric-name" placeholder="지표명"></td>
    <td><input type="number" class="metric-a" placeholder="0" step="any"></td>
    <td><input type="number" class="metric-b" placeholder="0" step="any"></td>
    <td class="computed diff-value">-</td>
    <td class="computed diff-pct">-</td>
    <td class="remove-row" title="삭제">✕</td>
  `;
  metricsBody.appendChild(row);
  bindMetricRow(row);
});

function bindMetricRow(row) {
  const inA = row.querySelector('.metric-a');
  const inB = row.querySelector('.metric-b');
  const diffVal = row.querySelector('.diff-value');
  const diffPct = row.querySelector('.diff-pct');
  const removeBtn = row.querySelector('.remove-row');

  function calc() {
    const a = parseFloat(inA.value);
    const b = parseFloat(inB.value);
    if (isNaN(a) || isNaN(b)) { diffVal.textContent = '-'; diffPct.textContent = '-'; diffVal.className = 'computed diff-value'; return; }
    const diff = a - b;
    const pct = a !== 0 ? (diff / a * 100) : 0;
    diffVal.textContent = formatNumber(diff);
    diffPct.textContent = pct.toFixed(2) + '%';
    diffVal.className = 'computed diff-value ' + (diff > 0 ? 'positive' : diff < 0 ? 'negative' : '');
    diffPct.className = 'computed diff-pct ' + (diff > 0 ? 'positive' : diff < 0 ? 'negative' : '');
  }
  inA.addEventListener('input', calc);
  inB.addEventListener('input', calc);
  removeBtn.addEventListener('click', () => {
    if (metricsBody.children.length > 1) row.remove();
  });
}
metricsBody.querySelectorAll('tr').forEach(bindMetricRow);

// --- API 통신 ---
async function ensureComparison() {
  // 기존 ID가 있으면 서버에 실존하는지 확인 (서버 재시작으로 store가 비었을 수 있음)
  if (comparisonId) {
    const check = await fetch(`${API}/api/comparisons/${comparisonId}`);
    if (check.ok) return;
    comparisonId = null;  // stale ID 리셋
  }
  const title = document.getElementById('inputTitle').value;
  const res = await fetch(`${API}/api/comparisons?title=${encodeURIComponent(title)}`, { method: 'POST' });
  const data = await res.json();
  comparisonId = data.id;
}

function getQueryData(panelId) {
  const panel = document.getElementById(panelId);
  const activeTab = panel.querySelector('.tabs button.active')?.dataset.tab || 'text';
  const sourceMap = { text: 'TEXT', file: 'FILE', wiki: 'WIKI' };
  return {
    source_type: sourceMap[activeTab],
    sql_raw: panel.querySelector('.sql-editor').value,
    dialect: panel.querySelector('.dialect-select').value,
  };
}

function getMetrics() {
  const rows = metricsBody.querySelectorAll('tr');
  const metrics = [];
  rows.forEach(row => {
    const name = row.querySelector('.metric-name')?.value?.trim();
    const a = row.querySelector('.metric-a')?.value;
    const b = row.querySelector('.metric-b')?.value;
    if (name && a !== '' && b !== '') {
      metrics.push({ metric_name: name, value_a: parseFloat(a), value_b: parseFloat(b) });
    }
  });
  return metrics;
}

// --- 임시저장 ---
document.getElementById('btnSave').addEventListener('click', async () => {
  await ensureComparison();
  const queryA = getQueryData('panelA');
  const queryB = getQueryData('panelB');

  await Promise.all([
    fetch(`${API}/api/comparisons/${comparisonId}/query-a`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(queryA)
    }),
    fetch(`${API}/api/comparisons/${comparisonId}/query-b`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(queryB)
    }),
    fetch(`${API}/api/comparisons/${comparisonId}/summary`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ metrics: getMetrics() })
    }),
  ]);
  showToast('임시저장 완료', { kind: 'success' });
});

// --- 검증 ---
document.getElementById('btnValidate').addEventListener('click', async () => {
  await ensureComparison();
  const queryA = getQueryData('panelA');
  const queryB = getQueryData('panelB');

  await Promise.all([
    fetch(`${API}/api/comparisons/${comparisonId}/query-a`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(queryA)
    }),
    fetch(`${API}/api/comparisons/${comparisonId}/query-b`, {
      method: 'PUT', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(queryB)
    }),
  ]);

  const res = await fetch(`${API}/api/comparisons/${comparisonId}/validate`, { method: 'POST' });
  const data = await res.json();
  showValidationResult(data);
});

function showValidationResult(data) {
  const modal = document.getElementById('validateModal');
  const results = document.getElementById('validateResults');
  const ignoreBtn = document.getElementById('btnIgnoreError');
  let html = '';
  let allValid = true;

  ['query_a', 'query_b'].forEach((key, idx) => {
    const r = data[key];
    const label = idx === 0 ? 'A쿼리' : 'B쿼리';
    if (!r) return;

    html += `<div class="result-item">`;
    if (r.is_valid) {
      html += `<div class="status-ok">✅ ${label}: 파싱 성공 (${r.dialect_detected})</div>`;
      if (r.structure) {
        html += `<div class="structure-tags" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;">`;
        const s = r.structure;
        if (s.select_columns) html += `<span style="padding:2px 8px;background:#313150;border-radius:10px;font-size:11px;color:#9090b0;">SELECT(${s.select_columns})</span>`;
        if (s.from_tables) html += `<span style="padding:2px 8px;background:#313150;border-radius:10px;font-size:11px;color:#9090b0;">FROM(${s.from_tables})</span>`;
        if (s.joins) html += `<span style="padding:2px 8px;background:#313150;border-radius:10px;font-size:11px;color:#9090b0;">JOIN(${s.joins})</span>`;
        if (s.where_conditions) html += `<span style="padding:2px 8px;background:#313150;border-radius:10px;font-size:11px;color:#9090b0;">WHERE(${s.where_conditions})</span>`;
        if (s.group_by_columns) html += `<span style="padding:2px 8px;background:#313150;border-radius:10px;font-size:11px;color:#9090b0;">GROUP BY(${s.group_by_columns})</span>`;
        if (s.subqueries) html += `<span style="padding:2px 8px;background:#313150;border-radius:10px;font-size:11px;color:#9090b0;">서브쿼리(${s.subqueries})</span>`;
        html += `</div>`;
      }
    } else {
      allValid = false;
      html += `<div class="status-err">❌ ${label}: 파싱 실패</div>`;
      if (r.error_message) html += `<div style="font-size:12px;color:#f05060;margin-top:4px;">${r.error_message}</div>`;
      if (r.suggestion) html += `<div class="status-suggestion">💡 ${r.suggestion}</div>`;
    }
    html += `</div>`;

    // 패널에도 상태 표시
    const panel = document.getElementById(idx === 0 ? 'panelA' : 'panelB');
    const statusEl = panel.querySelector('.validation-status');
    if (r.is_valid) {
      let tags = '';
      if (r.structure) {
        const s = r.structure;
        const parts = [];
        if (s.select_columns) parts.push(`SELECT(${s.select_columns})`);
        if (s.from_tables) parts.push(`FROM(${s.from_tables})`);
        if (s.joins) parts.push(`JOIN(${s.joins})`);
        if (s.where_conditions) parts.push(`WHERE(${s.where_conditions})`);
        if (s.group_by_columns) parts.push(`GROUP BY(${s.group_by_columns})`);
        tags = `<div class="structure-tags">${parts.map(p => `<span>${p}</span>`).join('')}</div>`;
      }
      statusEl.innerHTML = `<span class="status-ok">✅ SQL 유효 (${r.dialect_detected})</span>${tags}`;
    } else {
      statusEl.innerHTML = `<span class="status-err">❌ 파싱 실패</span>`;
    }
  });

  // 지표 검증
  const metrics = getMetrics();
  html += `<div class="result-item">`;
  if (metrics.length > 0) {
    html += `<div class="status-ok">✅ 차이 요약: ${metrics.length}개 지표</div>`;
    html += `<ul style="margin:6px 0 0 18px;padding:0;font-size:12px;color:#9090b0;">`;
    metrics.forEach(m => {
      const diff = m.value_a - m.value_b;
      html += `<li><b>${m.metric_name}</b> — A=${formatNumber(m.value_a)}, B=${formatNumber(m.value_b)}, 차이=${formatNumber(diff)}</li>`;
    });
    html += `</ul>`;
    // 입력 행 수와 불일치하면 안내
    const totalRows = metricsBody.querySelectorAll('tr').length;
    if (totalRows > metrics.length) {
      html += `<div style="font-size:11px;color:#d09050;margin-top:4px;">ⓘ ${totalRows}개 행 중 ${metrics.length}개만 유효합니다. 지표명/A/B 칸이 모두 채워진 행만 집계됩니다.</div>`;
    }
  } else {
    allValid = false;
    html += `<div class="status-err">❌ 차이 요약: 지표를 최소 1개 입력해주세요</div>`;
  }
  html += `</div>`;

  results.innerHTML = html;
  ignoreBtn.style.display = allValid ? 'none' : '';
  document.getElementById('btnExecute').disabled = !allValid;
  modal.classList.remove('hidden');
}

document.getElementById('btnCloseModal').addEventListener('click', () => {
  document.getElementById('validateModal').classList.add('hidden');
});
document.getElementById('btnIgnoreError').addEventListener('click', () => {
  document.getElementById('btnExecute').disabled = false;
  document.getElementById('validateModal').classList.add('hidden');
});

// --- 비교 실행 ---
document.getElementById('btnExecute').addEventListener('click', async () => {
  if (!comparisonId) { showToast('먼저 검증을 실행해주세요.', { kind: 'info' }); return; }

  // 지표 저장
  const sumRes = await fetch(`${API}/api/comparisons/${comparisonId}/summary`, {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ metrics: getMetrics() })
  });

  // 서버 store가 초기화됐을 때 (404) — 세션을 새로 만들고 재검증 요청
  if (sumRes.status === 404) {
    comparisonId = null;
    showToast('서버 세션이 만료되었습니다. "검증" 버튼을 다시 눌러주세요.', { kind: 'info' });
    document.getElementById('btnExecute').disabled = true;
    return;
  }

  const res = await fetch(`${API}/api/comparisons/${comparisonId}/execute`, { method: 'POST' });
  if (res.ok) {
    const data = await res.json();
    showComparisonResult(data);
  } else if (res.status === 404) {
    comparisonId = null;
    document.getElementById('btnExecute').disabled = true;
    showToast('서버 세션이 만료되었습니다. "검증" 버튼을 다시 눌러주세요.', { kind: 'info' });
  } else {
    const err = await res.json();
    showToast('실행 실패: ' + (err.detail || '알 수 없는 오류'));
  }
});

const SEVERITY_STYLE = {
  CRITICAL: { label: 'Critical', bg: '#5a1a1a', fg: '#ff9090', border: '#f05060' },
  WARNING:  { label: 'Warning',  bg: '#5a4a1a', fg: '#ffd060', border: '#d09030' },
  INFO:     { label: 'Info',     bg: '#1a3a5a', fg: '#80c0ff', border: '#4080c0' },
};

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const VERDICT_STYLE = {
  EQUIVALENT: { label: '동치 (같은 결과)', bg: '#1a4a2a', fg: '#a0e0b0', border: '#40c070' },
  DIVERGENT:  { label: '상이 (다른 결과 예상)', bg: '#5a1a1a', fg: '#ff9090', border: '#f05060' },
  LIMITED:    { label: '제한적 판정', bg: '#5a4a1a', fg: '#ffd060', border: '#d09030' },
};

const DIM_LABEL = {
  BASE_TABLES: '읽는 테이블',
  JOIN_GRAPH:  '조인 그래프',
  PREDICATES:  '필터 조건 (WHERE/HAVING)',
  GROUP_KEYS:  'GROUP BY 키',
  AGGREGATES:  '집계식',
  PROJECTIONS: '비집계 출력',
};

// 현재 활성 탭 기억 (판단 토글 후 재렌더시에도 유지)
let activeResultTab = 'semantic';

function showComparisonResult(req) {
  const modal = document.getElementById('resultModal');
  const container = document.getElementById('resultContent');
  const sem = req?.semantic_diff;
  const struct = req?.structure_diff;

  const tabBar = `
    <div style="display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid #303050;">
      <button class="result-tab" data-tab="semantic"
        style="padding:8px 16px;background:none;border:none;border-bottom:2px solid transparent;color:#a0a0c0;cursor:pointer;font-size:13px;">
        의미 비교 <span style="font-size:10px;color:#707090;">(같은 데이터?)</span>
      </button>
      <button class="result-tab" data-tab="structure"
        style="padding:8px 16px;background:none;border:none;border-bottom:2px solid transparent;color:#a0a0c0;cursor:pointer;font-size:13px;">
        구문 비교 <span style="font-size:10px;color:#707090;">(문법 차이)</span>
      </button>
    </div>
    <div id="resultTabBody"></div>
  `;

  container.innerHTML = tabBar;

  const tabButtons = container.querySelectorAll('.result-tab');
  const body = container.querySelector('#resultTabBody');

  const renderActive = () => {
    tabButtons.forEach(b => {
      const active = b.dataset.tab === activeResultTab;
      b.style.color = active ? '#e0e0f0' : '#a0a0c0';
      b.style.borderBottom = active ? '2px solid #6080c0' : '2px solid transparent';
      b.style.fontWeight = active ? '600' : '400';
    });
    body.innerHTML = '';
    if (activeResultTab === 'semantic') {
      renderSemanticInto(body, sem);
    } else {
      renderStructureInto(body, struct);
    }
  };

  tabButtons.forEach(b => {
    b.addEventListener('click', () => {
      activeResultTab = b.dataset.tab;
      renderActive();
    });
  });

  renderActive();
  modal.classList.remove('hidden');
}

function renderSemanticInto(body, sem) {
  if (!sem) {
    body.innerHTML = `<div class="status-err" style="padding:20px;">의미 비교 결과가 없습니다.</div>`;
    return;
  }

  const vstyle = VERDICT_STYLE[sem.verdict] || VERDICT_STYLE.LIMITED;
  let html = `<div style="padding:14px;background:${vstyle.bg};border-left:4px solid ${vstyle.border};border-radius:6px;margin-bottom:14px;">
    <div style="font-size:15px;font-weight:600;color:${vstyle.fg};">판정: ${vstyle.label}</div>
    <div style="font-size:12px;color:#c0c0d0;margin-top:6px;line-height:1.6;">${escapeHtml(sem.reason || '')}</div>
  </div>`;

  if (sem.error) {
    html += `<div style="padding:10px;background:#3a1a1a;border-left:3px solid #f05060;border-radius:4px;margin-bottom:12px;font-size:12px;color:#ffb0b0;">⚠ ${escapeHtml(sem.error)}</div>`;
  }

  if (sem.limitations && sem.limitations.length) {
    html += `<div style="padding:10px;background:#3a3520;border-left:3px solid #d09030;border-radius:4px;margin-bottom:14px;">
      <div style="font-size:12px;font-weight:600;color:#ffd060;margin-bottom:4px;">정규화 제한사항</div>
      <ul style="margin:0;padding-left:18px;font-size:12px;color:#d0c090;line-height:1.6;">
        ${sem.limitations.map(l => `<li>${escapeHtml(l)}</li>`).join('')}
      </ul>
    </div>`;
  }

  // 차원별 결과
  if (sem.dimensions && sem.dimensions.length) {
    html += `<div style="font-size:13px;font-weight:600;margin-bottom:8px;color:#c0c0e0;">차원별 비교</div>`;
    html += `<div style="display:flex;flex-direction:column;gap:8px;">`;
    sem.dimensions.forEach(d => {
      const icon = d.matched ? '✓' : '✗';
      const color = d.matched ? '#40c070' : '#f05060';
      const bg = d.matched ? '#1a2a20' : '#2a1a20';
      html += `<div style="padding:10px 12px;background:${bg};border-left:3px solid ${color};border-radius:4px;">
        <div style="display:flex;gap:10px;align-items:center;font-size:13px;">
          <span style="color:${color};font-weight:700;font-size:14px;">${icon}</span>
          <span style="color:#d0d0e0;font-weight:600;">${escapeHtml(DIM_LABEL[d.dimension] || d.dimension)}</span>
        </div>
        <div style="font-size:12px;color:#a0a0b8;margin-top:6px;line-height:1.5;">${escapeHtml(d.explanation || '')}</div>
        ${(d.only_in_a?.length || d.only_in_b?.length) ? `
          <div style="display:grid;grid-template-columns:60px 1fr;gap:6px;font-family:monospace;font-size:11px;margin-top:8px;">
            ${d.only_in_a?.length ? `<div style="color:#80a0c0;">A만:</div><div style="color:#c0d0e0;">${d.only_in_a.map(escapeHtml).join(', ')}</div>` : ''}
            ${d.only_in_b?.length ? `<div style="color:#c0a080;">B만:</div><div style="color:#e0d0c0;">${d.only_in_b.map(escapeHtml).join(', ')}</div>` : ''}
          </div>
        ` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  body.innerHTML = html;
}

function renderStructureInto(body, diff) {
  if (!diff) {
    body.innerHTML = `<div class="status-err" style="padding:20px;">구조 비교 결과가 없습니다.</div>`;
    return;
  }

  const criticalTotal = (diff.findings || []).filter(f => f.severity === 'CRITICAL').length;
  const unresolved = diff.unresolved_critical_count ?? criticalTotal;

  let html = '';

  // 요약 배지
  if (!diff.has_difference) {
    html += `<div style="padding:14px;background:#1a4a2a;border-left:4px solid #40c070;border-radius:6px;margin-bottom:14px;">
      <div style="font-size:15px;font-weight:600;color:#a0e0b0;">✅ 쿼리 구조 동일</div>
      <div style="font-size:12px;color:#80a890;margin-top:4px;">두 쿼리의 구조적 차이가 감지되지 않았습니다. 합계 차이는 원천 데이터 차이에 기인할 가능성이 높습니다. (다음 단계: Row diff)</div>
    </div>`;
  } else if (diff.fast_path_terminate) {
    html += `<div style="padding:14px;background:#5a1a1a;border-left:4px solid #f05060;border-radius:6px;margin-bottom:14px;">
      <div style="font-size:15px;font-weight:600;color:#ff9090;">⚠️ 구조 차이 발견 — Fast-path 종결</div>
      <div style="font-size:12px;color:#c09090;margin-top:4px;">
        미확인 Critical: <b>${unresolved}건</b> / 총 ${criticalTotal}건 · 주요 차이 절: <b>${escapeHtml(diff.dominant_clause || '-')}</b>
      </div>
      <div style="font-size:11px;color:#a08080;margin-top:6px;">각 항목의 <b>"동일하다고 판단"</b> 버튼으로 검토 완료 처리하세요. 모두 처리되면 다음 단계로 진행할 수 있습니다.</div>
    </div>`;
  } else if (criticalTotal > 0) {
    // Critical은 있으나 모두 사용자 확인됨
    html += `<div style="padding:14px;background:#1a4a2a;border-left:4px solid #40c070;border-radius:6px;margin-bottom:14px;">
      <div style="font-size:15px;font-weight:600;color:#a0e0b0;">✅ 모든 Critical 차이 검토 완료</div>
      <div style="font-size:12px;color:#80a890;margin-top:4px;">사용자가 모든 Critical 항목을 동일로 판단했습니다. 다음 단계(Row diff)로 진행 가능합니다.</div>
    </div>`;
  } else {
    html += `<div style="padding:14px;background:#5a4a1a;border-left:4px solid #d09030;border-radius:6px;margin-bottom:14px;">
      <div style="font-size:15px;font-weight:600;color:#ffd060;">△ 경미한 구조 차이</div>
      <div style="font-size:12px;color:#c0a060;margin-top:4px;">Warning/Info 수준의 차이만 있습니다. Row 단계로 진행 가능합니다.</div>
    </div>`;
  }

  // findings 리스트
  if (diff.findings && diff.findings.length > 0) {
    html += `<div style="font-size:13px;font-weight:600;margin-bottom:8px;color:#c0c0e0;">차이 상세 (${diff.findings.length}건)</div>`;
    html += `<div style="display:flex;flex-direction:column;gap:10px;max-height:440px;overflow-y:auto;">`;
    diff.findings.forEach((f, idx) => {
      const sev = SEVERITY_STYLE[f.severity] || SEVERITY_STYLE.INFO;
      const ack = !!f.user_acknowledged;
      const cardStyle = ack
        ? 'padding:12px;background:#1e2a20;border-left:4px solid #40c070;border-radius:4px;opacity:0.65;'
        : `padding:12px;background:#24243a;border-left:4px solid ${sev.border};border-radius:4px;`;
      const descStyle = ack
        ? 'font-size:13px;color:#80a088;margin-bottom:6px;text-decoration:line-through;'
        : 'font-size:13px;color:#d0d0e0;margin-bottom:6px;';

      html += `<div style="${cardStyle}">
        <div style="display:flex;gap:8px;align-items:center;margin-bottom:6px;flex-wrap:wrap;">
          <span style="padding:2px 8px;background:${sev.bg};color:${sev.fg};border-radius:10px;font-size:11px;font-weight:600;">${sev.label}</span>
          <span style="padding:2px 8px;background:#313150;color:#a0a0c0;border-radius:10px;font-size:11px;">${escapeHtml(f.clause)}</span>
          <span style="font-size:11px;color:#707090;font-family:monospace;">${escapeHtml(f.rule_id)}</span>
          ${ack ? `<span style="padding:2px 8px;background:#1a4a2a;color:#a0e0b0;border-radius:10px;font-size:11px;font-weight:600;margin-left:auto;">✓ 사용자 확인: 동일</span>` : `<span style="margin-left:auto;"></span>`}
          <button class="btn btn-sm" data-ack-index="${idx}" data-ack-to="${ack ? 'false' : 'true'}"
            style="padding:4px 10px;font-size:11px;${ack ? 'background:#3a2a2a;color:#c09090;' : 'background:#2a4a3a;color:#a0e0b0;'}">
            ${ack ? '판단 취소' : '동일하다고 판단'}
          </button>
        </div>
        <div style="${descStyle}">${escapeHtml(f.description)}</div>
        ${f.a_snippet || f.b_snippet ? `
          <div style="display:grid;grid-template-columns:60px 1fr;gap:6px;font-family:monospace;font-size:12px;margin-top:8px;">
            ${f.a_snippet ? `<div style="color:#80a0c0;">A:</div><div style="color:#c0d0e0;background:#1a2030;padding:4px 8px;border-radius:3px;">${escapeHtml(f.a_snippet)}</div>` : ''}
            ${f.b_snippet ? `<div style="color:#c0a080;">B:</div><div style="color:#e0d0c0;background:#2a2020;padding:4px 8px;border-radius:3px;">${escapeHtml(f.b_snippet)}</div>` : ''}
          </div>
        ` : ''}
        ${f.impact ? `<div style="font-size:11px;color:#909090;margin-top:6px;font-style:italic;">💡 ${escapeHtml(f.impact)}</div>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  body.innerHTML = html;

  // acknowledge 버튼 이벤트 바인딩 — PATCH 후 전체 ComparisonRequest 를 다시 받아 재렌더
  body.querySelectorAll('button[data-ack-index]').forEach(btn => {
    btn.addEventListener('click', async () => {
      const idx = parseInt(btn.dataset.ackIndex, 10);
      const to = btn.dataset.ackTo === 'true';
      btn.disabled = true;
      try {
        const res = await fetch(
          `${API}/api/comparisons/${comparisonId}/structure-diff/findings/${idx}`,
          {
            method: 'PATCH',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ acknowledged: to }),
          }
        );
        if (!res.ok) {
          showToast('판단 상태 변경 실패');
          btn.disabled = false;
          return;
        }
        const reqRes = await fetch(`${API}/api/comparisons/${comparisonId}`);
        if (reqRes.ok) {
          showComparisonResult(await reqRes.json());
        }
      } catch (e) {
        showToast('네트워크 오류: ' + e.message);
        btn.disabled = false;
      }
    });
  });
}

document.getElementById('btnCloseResultModal').addEventListener('click', () => {
  document.getElementById('resultModal').classList.add('hidden');
});
document.getElementById('resultModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.add('hidden');
});

// 모달 바깥 클릭으로 닫기
document.getElementById('validateModal').addEventListener('click', e => {
  if (e.target === e.currentTarget) e.currentTarget.classList.add('hidden');
});
</script>
